<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>flow field</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04050a; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #5d6a80; pointer-events: none; user-select: none;
    text-shadow: 0 0 8px #000;
  }
  #hud b { color: #9fb0cc; font-weight: 600; }
  #hud .dim { color: #39424f; }
  #toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    font: 12px ui-monospace, Menlo, monospace; color: #9fb0cc;
    background: rgba(10, 14, 22, 0.85); padding: 6px 14px; border-radius: 6px;
    opacity: 0; transition: opacity 0.35s; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>move</b> stir the field &nbsp;·&nbsp; <b>hold</b> pour a stream &nbsp;·&nbsp; <b>click</b> burst &nbsp;·&nbsp; <b>P</b> palette &nbsp;·&nbsp; <b>S</b> save png &nbsp;·&nbsp; <b>space</b> pause &nbsp;·&nbsp; <b>C</b> clear
  <br><span class="dim">nothing here is random. everything follows the same hidden wind.</span>
</div>
<div id="toast"></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const toastEl = document.getElementById('toast');
  const TAU = Math.PI * 2;

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- value noise ----------
  const perm = new Uint8Array(512);
  {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const hash2 = (x, y) => perm[(perm[x & 255] + y) & 255] * (1 / 255);
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = fade(xf), v = fade(yf);
    const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // ---------- palettes ----------
  const PALETTES = [
    { name: 'aurora', colors: [[64, 255, 208], [64, 160, 255], [160, 96, 255], [255, 110, 220]] },
    { name: 'ember',  colors: [[255, 214, 102], [255, 140, 66], [255, 72, 72], [190, 40, 120]] },
    { name: 'ocean',  colors: [[34, 211, 238], [59, 130, 246], [99, 102, 241], [16, 185, 129]] },
    { name: 'bloom',  colors: [[255, 110, 180], [255, 190, 120], [190, 255, 160], [150, 180, 255]] },
  ];
  let palIdx = 0;
  function palColor(t) {
    const cols = PALETTES[palIdx].colors;
    const n = cols.length;
    const x = (((t % 1) + 1) % 1) * n;
    const i = Math.floor(x), f = x - i;
    const a = cols[i % n], b = cols[(i + 1) % n];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 1400);
  }

  // ---------- particles ----------
  const parts = [];
  const MAX_PARTS = 6000;
  let hueGlobal = 0;
  let t = 0;

  function spawn(x, y, vx, vy) {
    if (parts.length >= MAX_PARTS) return;
    const seed = Math.random();
    parts.push({
      x, y, px: x, py: y,
      vx: vx || 0, vy: vy || 0,
      seed,
      max: 2.2 + seed * 2.2,
      life: 0,
    });
    parts[parts.length - 1].life = parts[parts.length - 1].max;
  }

  // seed the field so it's alive on open
  for (let i = 0; i < 900; i++) {
    spawn(Math.random() * W, Math.random() * H, 0, 0);
  }

  // ---------- mouse ----------
  let mx = -9999, my = -9999;
  let pmx = 0, pmy = 0, pmt = 0;
  let held = false;
  let lastEmitX = null, lastEmitY = null;

  function pointer(e) {
    const s = e.touches ? e.touches[0] : e;
    return { x: s.clientX, y: s.clientY };
  }

  function onMove(e) {
    const p = pointer(e);
    const now = performance.now();
    const dtm = Math.max((now - pmt) / 1000, 1 / 240);
    const mdx = p.x - mx, mdy = p.y - my;

    if (mx > -9000) {
      const mvelX = Math.max(-400, Math.min(400, mdx / dtm));
      const mvelY = Math.max(-400, Math.min(400, mdy / dtm));

      // emit along the path travelled
      if (lastEmitX === null) { lastEmitX = p.x; lastEmitY = p.y; }
      let dx = p.x - lastEmitX, dy = p.y - lastEmitY;
      let dist = Math.hypot(dx, dy);
      const STEP = 7;
      while (dist >= STEP) {
        const f = STEP / dist;
        lastEmitX += dx * f;
        lastEmitY += dy * f;
        spawn(lastEmitX + (Math.random() - 0.5) * 6,
              lastEmitY + (Math.random() - 0.5) * 6,
              mvelX * 0.35 + (Math.random() - 0.5) * 40,
              mvelY * 0.35 + (Math.random() - 0.5) * 40);
        dx = p.x - lastEmitX; dy = p.y - lastEmitY;
        dist = Math.hypot(dx, dy);
      }
    } else {
      lastEmitX = p.x; lastEmitY = p.y;
    }

    pmx = mx; pmy = my; pmt = now;
    mx = p.x; my = p.y;
    if (e.cancelable) e.preventDefault();
  }

  function onDown(e) {
    const p = pointer(e);
    held = true;
    mx = p.x; my = p.y;
    lastEmitX = p.x; lastEmitY = p.y;
    burst(p.x, p.y, 220);
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { held = false; }

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const spd = 60 + Math.pow(Math.random(), 2) * 340;
      spawn(x, y, Math.cos(a) * spd, Math.sin(a) * spd);
    }
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  // ---------- keys ----------
  let paused = false;
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; toast(paused ? 'paused' : 'running'); e.preventDefault(); }
    if (e.key === 'p' || e.key === 'P') {
      palIdx = (palIdx + 1) % PALETTES.length;
      toast('palette: ' + PALETTES[palIdx].name);
    }
    if (e.key === 'c' || e.key === 'C') {
      parts.length = 0;
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, W, H);
      toast('cleared');
    }
    if (e.key === 's' || e.key === 'S') {
      const a = document.createElement('a');
      a.download = 'flowfield-' + Date.now() + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('saved png');
    }
  });

  // ---------- simulation ----------
  const FIELD_SCALE = 0.002;
  const SWIRL_R = 170;

  function update(dt) {
    // ambient particles keep the field alive on its own
    if (parts.length < 2800) {
      for (let i = 0; i < 3; i++) spawn(Math.random() * W, Math.random() * H, 0, 0);
    }

    // hold = pour from the cursor
    if (held) {
      for (let i = 0; i < 5; i++) {
        spawn(mx + (Math.random() - 0.5) * 14,
              my + (Math.random() - 0.5) * 14,
              (Math.random() - 0.5) * 90,
              (Math.random() - 0.5) * 90);
      }
    }

    hueGlobal += dt * 0.03;
    const stir = Math.min(1, 2.6 * dt);
    const R2 = SWIRL_R * SWIRL_R;

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }

      // field direction: two octaves of noise, slowly drifting
      const nx = p.x * FIELD_SCALE + t * 0.05;
      const ny = p.y * FIELD_SCALE + t * 0.12;
      const n = noise2(nx, ny) * 0.65 + noise2(nx * 2.7 + 40, ny * 2.7 - 17) * 0.35;
      const ang = n * TAU * 2;
      const spd = 70 + 60 * p.seed;

      let tx = Math.cos(ang) * spd;
      let ty = Math.sin(ang) * spd;

      // cursor acts like a stirring stick
      const dx = p.x - mx, dy = p.y - my;
      const d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 0.001;
        const f = 1 - d / SWIRL_R;
        tx += (-dy / d) * f * 280;
        ty += ( dx / d) * f * 280;
      }

      p.vx += (tx - p.vx) * stir;
      p.vy += (ty - p.vy) * stir;

      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // die at the edges
      if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) {
        parts.splice(i, 1);
      }
    }
  }

  function draw() {
    // fade previous frame: low alpha = long silky trails
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4, 5, 10, 0.075)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.3;

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const lf = p.life / p.max;                    // 1 -> 0
      const a = Math.min(1, lf * 2.2) * 0.5;        // fade in fast, out slow
      const c = palColor(p.seed * 0.30 + hueGlobal);
      ctx.strokeStyle = 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    if (paused) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(200, 214, 240, 0.75)';
      ctx.font = '600 15px ui-monospace, Menlo, monospace';
      ctx.fillText('paused — space to resume', 18, 30);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!paused) { t += dt; update(dt); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
